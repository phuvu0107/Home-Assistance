name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every morning at about 7 AM Pacific, to pick up yesterday's PG&E data.
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      HAS_PGE: ${{ secrets.PGE_USERNAME != '' }}
      HAS_HEALTH: ${{ secrets.HEALTH_TOKEN_PHU != '' || secrets.HEALTH_TOKEN_NHI != '' }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp -r index.html styles.css app.js icons.js sync.js sync-config.js sw.js manifest.webmanifest icons avatars _site/
      - name: Add household sync config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: python3 sync/make_sync_config.py _site/sync-config.js
      - uses: actions/setup-python@v5
        if: env.HAS_PGE == 'true' || env.HAS_HEALTH == 'true'
        with:
          python-version: '3.12'
      # Skipped until the PG&E secrets are added. A failed sync keeps the last
      # published data and still deploys the site.
      - name: Sync PG&E energy data
        if: env.HAS_PGE == 'true'
        continue-on-error: true
        working-directory: sync
        env:
          PGE_USERNAME: ${{ secrets.PGE_USERNAME }}
          PGE_PASSWORD: ${{ secrets.PGE_PASSWORD }}
          PGE_LOGIN_DATA: ${{ secrets.PGE_LOGIN_DATA }}
          ENERGY_PASSPHRASE: ${{ secrets.ENERGY_PASSPHRASE }}
          PREV_URL: ${{ steps.pages.outputs.base_url }}/data/energy.enc.json
          OUT: ../_site/data/energy.enc.json
        run: |
          pip install --quiet -r requirements.txt
          python pge_sync.py
      # Skipped until someone links a Fitbit with sync/health_pair.py.
      - name: Sync Fitbit health data
        if: env.HAS_HEALTH == 'true'
        continue-on-error: true
        working-directory: sync
        env:
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          HEALTH_TOKEN_PHU: ${{ secrets.HEALTH_TOKEN_PHU }}
          HEALTH_TOKEN_NHI: ${{ secrets.HEALTH_TOKEN_NHI }}
          ENERGY_PASSPHRASE: ${{ secrets.ENERGY_PASSPHRASE }}
          PREV_URL: ${{ steps.pages.outputs.base_url }}/data/health.enc.json
          OUT: ../_site/data/health.enc.json
        run: |
          pip install --quiet cryptography==50.0.2
          python health_sync.py
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
