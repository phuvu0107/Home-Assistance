name: Daily summary email

on:
  schedule:
    # 7 AM, noon, 5 PM and 9 PM Pacific. Each hour is listed for summer (PDT) and winter (PST)
    # time; the script sends only the one that matches today's clock. The morning one runs
    # at :30, after the 7 AM deploy has published yesterday's PG&E data.
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'
  # An outside timer can start this on time with a slot (see README), since GitHub can start
  # scheduled runs hours late.
  workflow_dispatch:
    inputs:
      slot:
        description: Which email (auto picks the nearest)
        type: choice
        options: [auto, morning, midday, evening, night]
        default: auto

permissions:
  contents: read

jobs:
  email:
    # With an outside timer set up, GitHub's own schedule stands down so nothing sends twice.
    if: github.event_name != 'schedule' || vars.EMAIL_TIMER != 'external'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Does nothing until the email secrets are added (see README).
      - name: Send the summary
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          HOUSEHOLD_PASSPHRASE: ${{ secrets.HOUSEHOLD_PASSPHRASE }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
          ENERGY_PASSPHRASE: ${{ secrets.ENERGY_PASSPHRASE }}
          ENERGY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/energy.enc.json
        run: |
          pip install --quiet cryptography==50.0.2
          python sync/daily_email.py
