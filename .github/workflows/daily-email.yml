name: Daily summary email

on:
  schedule:
    # Each household that turned the email on in Settings gets it at 7:30 AM, noon, 5 PM and
    # 9 PM on its own clock. GitHub starts scheduled runs hours late, so this starts every hour
    # and each run keeps sending emails as they come due for 5½ hours. Only one scheduled run
    # goes at a time, and each email is marked on its household once sent.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      home:
        description: Household id (Settings › Connections › Summary email); blank is HOME_ID
        type: string
        default: ''
      slot:
        description: Which email (auto picks the nearest)
        type: choice
        options: [auto, morning, midday, evening, night]
        default: auto

concurrency:
  group: daily-email-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet cryptography==50.0.2
      # Does nothing until the email secrets are added (see README).
      - name: Send the summaries
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EMAIL_SMTP_USER: ${{ secrets.EMAIL_SMTP_USER }}
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          HOME_ID: ${{ secrets.HOME_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SEND_HOME: ${{ inputs.home }}
          SLOT: ${{ inputs.slot }}
          ENERGY_PASSPHRASE: ${{ secrets.ENERGY_PASSPHRASE }}
          ENERGY_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/energy.enc.json
        run: python sync/daily_email.py
