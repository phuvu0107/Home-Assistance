<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hometide</title>
  <meta name="apple-mobile-web-app-title" content="Hometide">
  <meta name="application-name" content="Hometide">
  <meta name="description" content="Touch-friendly home dashboard for any tablet, laptop or wall-mounted screen.">
  <meta name="theme-color" content="#F7E7CB">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <div class="dome-scrim" id="dome-scrim"></div>
    <div class="dome" id="dome" role="menu" aria-label="More pages"></div>
    <main class="main">
      <section class="hero" id="hero">
        <div class="sky" aria-hidden="true">
          <div class="sky-stars"><i style="left:38%;top:22%"></i><i style="left:52%;top:12%"></i><i style="left:61%;top:34%"></i><i style="left:70%;top:16%"></i><i style="left:79%;top:40%"></i><i style="left:86%;top:20%"></i><i style="left:46%;top:44%"></i><i style="left:93%;top:52%"></i></div>
          <div class="sky-orb" id="orb"><span class="rays"></span><span class="glow"></span><span class="body"></span></div>
          <div class="wx-fx" id="wx-fx"></div>
        </div>
        <svg class="hero-art" viewBox="0 0 1000 200" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">
          <path class="m1" d="M250 200 C380 150 450 115 530 125 C610 135 650 100 720 92 C790 84 840 120 900 118 C950 116 980 110 1000 112 L1000 200Z"/>
          <path class="m2" d="M400 200 C500 170 590 150 680 158 C770 166 820 140 890 146 C940 150 975 160 1000 162 L1000 200Z"/>
          <g class="palm" transform="translate(915 118) scale(.75)">
            <path d="M40 108 C38 80 34 50 26 22" stroke-width="5" fill="none"/>
            <path d="M26 22 C10 10 -14 12 -26 24 C-8 18 10 20 26 22Z"/>
            <path d="M26 22 C18 2 0 -8 -14 -4 C0 2 14 10 26 22Z"/>
            <path d="M26 22 C34 0 54 -6 70 2 C54 4 40 10 26 22Z"/>
            <path d="M26 22 C46 14 70 18 82 32 C64 26 46 24 26 22Z"/>
            <path d="M26 22 C40 30 50 46 50 60 C42 44 34 34 26 22Z"/>
          </g>
        </svg>
        <a class="hero-people av-pair" href="#/settings" hidden>
        </a>
        <div class="hero-text">
          <div class="hero-greet" id="greeting">Good evening</div>
          <div class="hero-clock"><span id="clock"></span><span class="hero-tod" id="tod-icon"></span></div>
          <div class="hero-date" id="date"></div>
          <div class="sun-note" id="sun-note"></div>
        </div>
        <div class="hero-wx" id="hero-wx"></div>
        <a class="hero-me" id="hero-me" href="#/settings" hidden></a>
      </section>

      <div id="view" class="view"></div>
    </main>
  </div>
  <button class="fab" id="fab" hidden></button>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js" type="module"></script>
</body>
</html>
